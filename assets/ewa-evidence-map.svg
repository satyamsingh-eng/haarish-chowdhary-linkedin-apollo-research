<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">EWA evidence map</title>
<desc id="desc">A diagram showing the public EWA brand, Haarish, the ewa.group domain, Apollo, Apolonia, and the unresolved legal company and licence.</desc>
<defs><style>
.t{font-family:Inter,Arial,sans-serif;fill:#111}.m{font-family:JetBrains Mono,monospace;font-size:15px;letter-spacing:.04em;fill:#60656d}.h{font-family:Sora,Arial,sans-serif;font-weight:700;font-size:24px;fill:#111}.s{font-family:Inter,Arial,sans-serif;font-size:17px;fill:#555b64}.box{fill:#fff;stroke:#d6d9df;stroke-width:2}.dark{fill:#111;stroke:#111}.darktext{fill:#fff}.warn{fill:#fff7e8;stroke:#d88d22;stroke-width:2}.unknown{fill:#f1f3f5;stroke:#8a929c;stroke-width:2;stroke-dasharray:8 8}.bad{fill:#fff0ef;stroke:#b74b46;stroke-width:2}.line{stroke:#7d858e;stroke-width:3;fill:none}.dash{stroke:#a46b17;stroke-width:3;stroke-dasharray:9 8;fill:none}.badline{stroke:#b74b46;stroke-width:3;stroke-dasharray:9 8;fill:none}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d858e"/></marker><marker id="dasharrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a46b17"/></marker><marker id="badarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b74b46"/></marker></defs>
<rect x="20" y="20" width="1160" height="610" rx="24" fill="#f7f8fa"/>
<text x="60" y="72" class="m">EWA / PUBLIC EVIDENCE MAP</text>
<text x="60" y="108" class="h">What connects — and what still does not</text>
<rect x="70" y="160" width="300" height="150" rx="16" class="box"/><text x="96" y="202" class="m">PUBLIC COMPANY PAGE</text><text x="96" y="240" class="h">EWA Investments</text><text x="96" y="270" class="h">Strategies</text><text x="96" y="295" class="s">Dubai · founded 2025 · 2–10</text>
<rect x="450" y="160" width="300" height="150" rx="16" class="dark"/><text x="476" y="202" class="m darktext">PERSON MATCH</text><text x="476" y="240" class="h darktext">Haarish</text><text x="476" y="270" class="h darktext">Chowdhary</text><text x="476" y="295" class="s darktext">Apollo lead: CEO at EWA from May 2025</text>
<rect x="830" y="160" width="300" height="150" rx="16" class="box"/><text x="856" y="202" class="m">PUBLIC DOMAIN</text><text x="856" y="245" class="h">ewa.group</text><text x="856" y="280" class="s">Thin landing page · no legal name</text><text x="856" y="304" class="s">or licence shown</text>
<path d="M370 235 H440" class="line" marker-end="url(#arrow)"/><text x="382" y="218" class="m">reposts posts</text>
<path d="M760 235 H820" class="dash" marker-end="url(#dasharrow)"/><text x="770" y="218" class="m">role lead</text>
<path d="M600 320 V405" class="dash" marker-end="url(#dasharrow)"/>
<rect x="390" y="420" width="420" height="130" rx="16" class="unknown"/><text x="420" y="462" class="m">UNRESOLVED DOCUMENT CHECK</text><text x="420" y="500" class="h">Legal company + licence</text><text x="420" y="530" class="s">Registration · owners · activities · client-money rules</text>
<path d="M220 320 V405 H390" class="line" marker-end="url(#arrow)"/><text x="90" y="368" class="m">brand page only</text>
<path d="M980 320 V405 H810" class="line" marker-end="url(#arrow)"/><text x="878" y="368" class="m">domain registered 06 May 2025</text>
<rect x="70" y="420" width="250" height="130" rx="16" class="warn"/><text x="96" y="462" class="m">SECONDARY DATABASE</text><text x="96" y="500" class="h">Altss / CRD 308977</text><text x="96" y="530" class="s">Mixed U.S. EWA record</text>
<path d="M320 485 H380" class="badline" marker-end="url(#badarrow)"/><text x="325" y="468" class="m">do not merge</text>
<rect x="880" y="420" width="250" height="130" rx="16" class="warn"/><text x="906" y="462" class="m">SEPARATE PUBLIC CLAIM</text><text x="906" y="500" class="h">Apolonia</text><text x="906" y="530" class="s">Haarish senior title; overlap unclear</text>
<path d="M880 485 H820" class="dash" marker-end="url(#dasharrow)"/>
<text x="70" y="592" class="m">SOLID = public page or domain record · DASHED = lead or claim · RED = conflicting identity data</text>
</svg>